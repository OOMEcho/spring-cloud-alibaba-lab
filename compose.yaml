# 只启动中间件，Java 服务仍在 IDEA / 宿主机运行。
# 使用 docker compose --env-file .env.compose ...；不读取日常 .env。
name: cloud-lab
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请填写 .env.compose 的 MYSQL_ROOT_PASSWORD}
      DB_USERNAME: ${DB_USERNAME:-cloud_lab}
      DB_PASSWORD: ${DB_PASSWORD:?请填写业务库密码}
      SEATA_DB_PASSWORD: ${SEATA_DB_PASSWORD:?请填写 Seata 存储密码}
    ports:
      - "127.0.0.1:${DB_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/10-project.sh:ro
      - ./sql:/opt/lab/sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h127.0.0.1 -uroot -Nse "SELECT COUNT(*) FROM cloud_seata.global_table"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请填写 Redis 密码}
    command: [sh, -ec, 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1.8-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME:-cloud_lab}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?请填写 RabbitMQ 密码}
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_VHOST:-/cloud-lab}
    ports:
      - "127.0.0.1:${RABBIT_PORT:-15673}:5672"
      - "127.0.0.1:${RABBIT_MANAGEMENT_PORT:-25672}:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  nacos:
    image: nacos/nacos-server:v3.0.3
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: 'true'
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请填写 Base64 编码的 Nacos JWT 密钥}
      NACOS_AUTH_IDENTITY_KEY: cloud-lab
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请填写 Nacos 内部身份值}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:${NACOS_API_PORT:-18848}:8848"
      # Nacos 客户端按 API 端口 + 1000 连接 gRPC；修改 API 映射时同步修改此端口。
      - "127.0.0.1:${NACOS_GRPC_PORT:-19848}:9848"
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-18080}:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      # 同时检查 HTTP 成功与 Nacos 就绪码，避免模块尚未就绪时启动初始化任务。
      test:
        - CMD-SHELL
        - >-
          response=$$(curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness) &&
          printf '%s' "$$response" | grep -Eq '"code"[[:space:]]*:[[:space:]]*0[[:space:]]*[,}]'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  nacos-init:
    image: curlimages/curl:8.12.1
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请填写 Nacos 管理员密码}
      NACOS_GROUP: ${NACOS_GROUP:-LAB_GROUP}
    entrypoint: [sh, /opt/lab/init.sh]
    volumes:
      - ./docker/nacos/init.sh:/opt/lab/init.sh:ro
      - ./docs/nacos:/opt/lab/config:ro
    restart: 'no'

  sentinel:
    build:
      context: ./docker/sentinel
    ports:
      - "127.0.0.1:${SENTINEL_DASHBOARD_PORT:-18858}:8858"
    environment:
      SENTINEL_USERNAME: ${SENTINEL_USERNAME:-sentinel}
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:?请填写 Sentinel 控制台密码}
    command:
      - sh
      - -ec
      - 'exec java -Xms128m -Xmx256m -jar /app/sentinel-dashboard.jar --server.port=8858 --auth.username="$${SENTINEL_USERNAME}" --auth.password="$${SENTINEL_PASSWORD}"'

  seata:
    # 在官方镜像上补齐 TC 的 MySQL JDBC 驱动，版本固定为 8.0.33。
    image: cloud-lab-seata:2.5.0-mysql8.0.33
    build:
      context: ./docker/seata
    # 中间件同时重启时 TC 可能先遇到数据库不可用，允许恢复后自动重连启动。
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # 初始化管理员成功后再注册 TC，避免鉴权启用但账号尚未创建。
      nacos-init:
        condition: service_completed_successfully
    environment:
      # 公布非回环宿主机 IP，避免 Seata 自动选择容器内部地址。
      SEATA_IP: ${SEATA_ADVERTISED_IP:?请填写客户端可达的非回环宿主机 IP}
      # TC 的 XID 包含公布端口；内外端口一致，防止客户端恢复事务时连错地址。
      SEATA_PORT: ${SEATA_PORT:-18091}
      SEATA_DB_PASSWORD: ${SEATA_DB_PASSWORD:?请填写 Seata 存储密码}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请填写 Nacos 管理员密码}
      SEATA_NACOS_APPLICATION: ${SEATA_NACOS_APPLICATION:-seata-server}
      SEATA_NACOS_NAMESPACE: ${SEATA_NACOS_NAMESPACE:-}
      SEATA_NACOS_GROUP: ${SEATA_NACOS_GROUP:-SEATA_GROUP}
      SEATA_NACOS_CLUSTER: ${SEATA_NACOS_CLUSTER:-default}
      JVM_XMS: 128m
      JVM_XMX: 512m
      JVM_MaxDirectMemorySize: 256m
    ports:
      - "${SEATA_ADVERTISED_IP:?请填写客户端可达的非回环宿主机 IP}:${SEATA_PORT:-18091}:${SEATA_PORT:-18091}"
    volumes:
      - ./docker/seata/application.yml:/seata-server/resources/application.yml:ro
      - seata-logs:/seata-server/logs
    healthcheck:
      # 官方镜像包含 bash；检查真实 TC 监听端口，不依赖已关闭的 Web 控制台。
      test: [CMD-SHELL, 'bash -ec "exec 3<>/dev/tcp/127.0.0.1/$${SEATA_PORT}"']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  rabbit-data:
  nacos-data:
  nacos-logs:
  seata-logs:
