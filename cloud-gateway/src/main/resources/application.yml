server:
  port: ${SERVER_PORT:8100}
spring:
  application:
    name: cloud-gateway
  profiles:
    default: nacos
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1200
            response-timeout: 5s
    loadbalancer:
      # 故障不自动重试，避免未来写请求发生重复执行。
      retry:
        enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: 用户服务
        url: /docs/user
      - name: 订单服务
        url: /docs/order
      - name: 商品服务
        url: /docs/product
      - name: 库存服务
        url: /docs/stock
      - name: 通知服务
        url: /docs/notification
    urls-primary-name: 用户服务
    tags-sorter: alpha
    operations-sorter: alpha
