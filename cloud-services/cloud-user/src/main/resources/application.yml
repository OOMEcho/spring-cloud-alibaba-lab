server:
  port: ${SERVER_PORT:8101}
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_SCHEMA:cloud_user}?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: cloud-user
  profiles:
    # 默认接入真实 Nacos，使用必需的远程配置。
    default: nacos
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
logging:
  pattern:
    level: '%5p [${spring.application.name},%X{requestId:-}]'
lab:
  message: 本地默认配置
  order:
    max-quantity: 10

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
