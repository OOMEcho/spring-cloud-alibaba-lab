server:
  port: ${SERVER_PORT:8103}
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_SCHEMA:cloud_product}?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 500ms
      timeout: 500ms
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: cloud-product
  profiles:
    default: nacos
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  pattern:
    level: '%5p [${spring.application.name},%X{requestId:-}]'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

lab:
  cache:
    enabled: true
    prefix: ${REDIS_CACHE_PREFIX:cloud-lab:}
    ttl-seconds: 30
